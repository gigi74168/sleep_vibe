# Publie une release à partir d'un tag `vX.Y`. L'APK est compilé ici plutôt qu'envoyé
# depuis un poste : c'est le même runner que la CI, donc le même résultat que ce qui a été
# vérifié sur la branche.
#
# L'APK est signé avec la clé de debug (voir app/build.gradle.kts) : suffisant pour une
# installation personnelle, pas pour le Play Store.
name: Release

on:
  push:
    tags: ["v*"]
  # Permet de publier sans pousser de tag à la main : le job crée le tag lui-même,
  # au commit sur lequel on le déclenche.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, tag compris (ex. v2.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: APK et release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: assembleRelease
        run: ./gradlew assembleRelease --stacktrace

      # La version vient du tag poussé, ou du paramètre quand on déclenche à la main.
      - name: Version
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Le nom du fichier porte la version : un APK téléchargé six mois plus tard reste
      # identifiable sans l'ouvrir.
      - name: Renommer l'APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          mv "$apk" "sleeptrack-${{ steps.v.outputs.tag }}.apk"
          ls -la sleeptrack-*.apk

      # Crée le tag s'il n'existe pas encore, au commit courant.
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Sleep Track ${{ steps.v.outputs.tag }}
          files: sleeptrack-*.apk
          # Un tag à suffixe (v3.1.0-beta) part en pré-release : la dernière version stable
          # reste celle que GitHub met en avant.
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
          generate_release_notes: true
          body: |
            Installe l'APK ci-dessous : `adb install -r sleeptrack-${{ steps.v.outputs.tag }}.apk`,
            ou ouvre-le depuis le téléphone.

            Signé avec la clé de debug : bon pour une installation personnelle, pas pour le
            Play Store. Android demandera d'autoriser l'installation depuis cette source.
