# Compile l'app à chaque push : rien d'autre dans le dépôt ne vérifie qu'elle compile.
# L'APK produit est gardé en artéfact, de quoi l'installer sans rien compiler soi-même.
name: Compilation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pas de setup-android ici : l'action installe le paquet `tools`, retiré du SDK
      # depuis, et échoue dessus. L'image du runner fournit déjà le SDK avec ses licences
      # acceptées (ANDROID_HOME) ; AGP télécharge lui-même la plateforme 36 si elle manque.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pas de --stacktrace : sur une erreur de compilation il noie les lignes « e: »
      # sous deux cents lignes de pile Gradle, qui n'apprennent rien.
      # Les tests JVM (score de récupération) passent avant la compilation de l'APK.
      - name: assembleDebug
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      # Republie les erreurs à la toute fin du log, où elles se lisent sans dérouler.
      - name: Erreurs de compilation
        if: failure()
        run: |
          echo "::group::Erreurs Kotlin"
          grep -E '^e: |^error: |FAILURE: ' /tmp/build.log | head -n 60 || echo "(aucune ligne « e: » trouvée)"
          echo "::endgroup::"

      - name: Garder l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
